services:
  dermatlas-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dermatlas
      POSTGRES_PASSWORD: dermatlas
      POSTGRES_DB: dermatlas_dev
    ports:
      - "5432:5432"
    volumes:
      - dermatlas_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermatlas -d dermatlas_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  dermatlas-postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dermatlas
      POSTGRES_PASSWORD: dermatlas
      POSTGRES_DB: dermatlas_test
    ports:
      - "5433:5432"
    volumes:
      - dermatlas_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermatlas -d dermatlas_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dermatlas_dev_data:
  dermatlas_test_data:
